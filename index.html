<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Snake Arcade</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="top-bar">
        <div class="score-pill">
          <span class="label">High Score</span>
          <span id="highScore">0</span>
        </div>
        <div class="score-pill">
          <span class="label">Score</span>
          <span id="score">0</span>
        </div>
      </header>

      <section class="controls" aria-label="Game controls">
        <button id="rulesBtn" type="button">Rules (H)</button>
        <button id="pauseBtn" type="button">Pause (P)</button>
        <button id="restartBtn" type="button">Restart (R)</button>
      </section>

      <section class="game-panel">
        <canvas id="gameCanvas" width="320" height="320"></canvas>
        <div id="overlay" class="overlay hidden" aria-live="polite">
          <div class="overlay-card">
            <h1 id="overlayTitle">Paused</h1>
            <p id="overlayMessage">Press P to continue.</p>
            <button id="overlayRestartBtn" type="button">Restart</button>
          </div>
        </div>
      </section>

      <section id="rulesPanel" class="rules-panel hidden" aria-label="Game rules">
        <h2>How to play</h2>
        <ul>
          <li>Use the arrow keys to move.</li>
          <li>Eat apples to grow and increase your score.</li>
          <li>There are 3 apples on the board at once.</li>
          <li>Do not hit the wall or your own tail.</li>
          <li>Press H for rules, P to pause, and R to restart.</li>
        </ul>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
